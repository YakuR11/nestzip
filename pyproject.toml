[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nestzip"
dynamic = ["version"]
description = "Zip a folder that doesn't fit twice on your disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hicham Dbija" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Homepage = "https://github.com/YakuR11/nestzip"

[project.scripts]
nestzip = "nestzip:main"

[tool.setuptools]
py-modules = ["nestzip"]

[tool.setuptools.dynamic]
version = { attr = "nestzip.__version__" }
