name: release

# Push a tag like v1.2.0: the tests run, then nestzip.exe and the Python
# package are built and attached to a GitHub release with the CHANGELOG notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  windows-exe:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller==6.22.3
      # nestzip.exe is the window (no console); nestzip-cli.exe is for terminals and scripts
      - run: pyinstaller --onefile --windowed --name nestzip nestzip.py
      - run: pyinstaller --onefile --console --name nestzip-cli nestzip.py
      - name: Smoke test both exes, the way people start them
        shell: pwsh
        run: |
          function Make($dir) { New-Item -ItemType Directory "$dir\sub" | Out-Null; Set-Content "$dir\a.txt" "hello"; Set-Content "$dir\sub\b.txt" "world" }
          function Packed($dir) { if ((Test-Path $dir) -or -not (Test-Path "$dir.zip")) { throw "$dir was not packed" } }

          dist\nestzip-cli.exe --version
          Make smoke\Args; dist\nestzip-cli.exe pack smoke\Args -y --keep-free 0; Packed smoke\Args

          # Double-clicked console exe: no arguments, the folder is typed (or dragged) in, then y, then Enter
          Make smoke\Click; "$PWD\smoke\Click`ny`n`n" | dist\nestzip-cli.exe; Packed smoke\Click

          # The window exe runs commands too, silently
          Make smoke\Window; Start-Process dist\nestzip.exe -ArgumentList "pack", "smoke\Window", "-y", "--keep-free", "0" -Wait; Packed smoke\Window

          # Double-clicked window exe: it must open and stay open
          $window = Start-Process dist\nestzip.exe -PassThru
          Start-Sleep -Seconds 8
          if ($window.HasExited) { throw "nestzip.exe closed right away (exit code $($window.ExitCode))" }
          Stop-Process -Id $window.Id
      # Lets anyone check an exe was built here, from this commit: gh attestation verify nestzip.exe --repo YakuR11/nestzip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/*.exe

  python-package:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python -m pip install build==1.6.1 && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

  github-release:
    needs: [windows-exe, python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (found) exit; if (index($0, v)) { found = 1; next } } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "nestzip $version" --notes-file notes.md --verify-tag
