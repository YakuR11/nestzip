name: release

# Push a tag like v1.2.0: the tests run, then nestzip.exe and the Python
# package are built and attached to a GitHub release with the CHANGELOG notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  windows-exe:
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install pyinstaller==6.22.3
      - run: pyinstaller --onefile --console --name nestzip nestzip.py
      - name: Smoke test the exe
        shell: pwsh
        run: |
          dist\nestzip.exe --version
          New-Item -ItemType Directory smoke\Docs | Out-Null
          Set-Content smoke\Docs\a.txt "hello"
          dist\nestzip.exe pack smoke\Docs -y --keep-free 0
          if ((Test-Path smoke\Docs) -or -not (Test-Path smoke\Docs.zip)) { exit 1 }
      # Lets anyone check the exe was built here, from this commit: gh attestation verify nestzip.exe --repo YakuR11/nestzip
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nestzip.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: dist/nestzip.exe

  python-package:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python -m pip install build==1.6.1 && python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

  github-release:
    needs: [windows-exe, python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## / { if (found) exit; if (index($0, v)) { found = 1; next } } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "nestzip $version" --notes-file notes.md --verify-tag
