name: tests

on:
  push:
    branches: ["**"]  # tags go through release.yml, which runs these tests first
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Actions pinned to a commit: a moved tag can't change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error -m unittest -v
